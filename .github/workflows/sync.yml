name: Refresh app versions

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps.json, build.mjs]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Publish to Cloudflare R2
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 r2 object put pour-registry-13-oct-2026/apps/index.json --file index.json --content-type application/json --remote
      - name: Commit
        run: |
          git config user.name "pour-apps bot"
          git config user.email "JKS.sys@icloud.com"
          git add index.json
          git diff --cached --quiet || (git commit -qm "refresh: $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q)
